app:
  host: 127.0.0.1
  port: 5080
  tmux_socket: claude-control
  tmux_prefix: "cldcc-"
  scrollback_limit: 10000
  cldStartCmd: "claude"

agents:
  - name: base
    path: .
    type: docker
    container: cldcon-base
    make_run: "make run NAME=base"
    make_stop: "make stop NAME=base"
    cldStartCmd: "claude --dangerously-skip-permissions"
    readme: base/readme.md
    auto_start: false
    tags: [base, ubuntu, node]
    # share: /data/proj/myproject   # optional: mounts host folder to ~/share in container

  - name: localShell
    path: .
    type: local_shell
    readme: readme.md
    auto_start: false
    tags: [host, utility]

  - name: grif
    path: .
    type: docker
    container: cldcon-grif
    make_run: "make run NAME=grif"
    make_stop: "make stop NAME=grif"
    cldStartCmd: "claude --dangerously-skip-permissions"
    readme: grif/readme.md
    auto_start: false
    tags: [login, plug]
