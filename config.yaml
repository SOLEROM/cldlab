app:
  host: 127.0.0.1
  port: 5080
  tmux_socket: claude-control
  tmux_prefix: "cldcc-"
  scrollback_limit: 10000
  cldStartCmd: "claude"

agents:
  # - name: base
  #   path: .
  #   type: docker
  #   container: cldcon-base
  #   make_run: "make run NAME=base"
  #   make_stop: "make stop NAME=base"
  #   cldStartCmd: "claude --dangerously-skip-permissions"
  #   readme: base/readme.md
  #   auto_start: false
  #   tags: [base, ubuntu, node]
    # share: /data/proj/myproject   # optional: mounts host folder to ~/share in container

  - name: 0_cldLAB
    path: .
    type: local_shell
    readme: readme.md
    auto_start: false
    tags: [host, utility]

  - name: 1_Gandalf
    path: ../gandalf
    type: local_shell
    readme: readme.md
    auto_start: false
    tags: [host, utility]

  - name: ECC
    path: .
    type: docker
    container: cldcon-ecc
    make_run: "make run NAME=ecc"
    make_stop: "make stop NAME=ecc"
    cldStartCmd: "claude --dangerously-skip-permissions"
    readme: ecc/readme.md
    auto_start: false
    tags: [login, plug]
    share: /data/proj/agents

  - name: gstack
    path: .
    type: docker
    container: cldcon-gstack
    make_run: "make run NAME=gstack"
    make_stop: "make stop NAME=gstack"
    cldStartCmd: "claude --dangerously-skip-permissions"
    readme: gstack/readme.md
    auto_start: false
    tags: [login, plug]
    share: /data/proj/agents

  - name: OhMyCld
    path: .
    type: docker
    container: cldcon-ohmycld
    make_run: "make run NAME=ohmycld"
    make_stop: "make stop NAME=ohmycld"
    cldStartCmd: "claude --dangerously-skip-permissions"
    readme: ohmycld/readme.md
    auto_start: false
    tags: [login, plug]
    share: /data/proj/agents

  - name: gsd2
    path: .
    type: docker
    container: cldcon-gsd2
    make_run: "make run NAME=gsd2"
    make_stop: "make stop NAME=gsd2"
    cldStartCmd: "gsd"
    readme: gsd2/readme.md
    auto_start: false
    tags: [login, plug]
    share: /data/proj/agents

  - name: grif
    path: .
    type: docker
    container: cldcon-grif
    make_run: "make run NAME=grif"
    make_stop: "make stop NAME=grif"
    cldStartCmd: "claude --dangerously-skip-permissions"
    readme: grif/readme.md
    auto_start: false
    tags: [login, plug]
    share: /data/proj/agents

  - name: fman
    path: .
    type: docker
    container: cldcon-fman
    make_run: "make run NAME=fman"
    make_stop: "make stop NAME=fman"
    cldStartCmd: "/home/user/.local/bin/feynman"
    readme: fman/readme.md
    auto_start: false
    tags: [login, plug]

  - name: skilkit
    path: .
    type: docker
    container: cldcon-skilkit
    make_run: "make run NAME=skilkit"
    make_stop: "make stop NAME=skilkit"
    cldStartCmd: "claude --dangerously-skip-permissions"
    readme: skilkit/readme.md
    auto_start: false
    tags: [login, plug]
